[platformio]
; This file can act as a global configuration.
; Students can create their own platformio.ini in HW folders, or use this.
default_envs = esp32s3

[extra]
uart_speed = 115200

[env]
; Global settings for all environments
; These flags apply only to your source code, not to external libraries.
build_src_flags =
    -Wall
    -Wextra
    -Werror
    -Wno-unused-parameter
    -DUART_SPEED=${extra.uart_speed}

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino ; Or espidf, based on student choice
monitor_speed = ${extra.uart_speed}
lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit BME280 Library
    olikraus/U8g2_for_Adafruit_GFX

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino ; Or stm32cube, based on student choice
upload_protocol = dfu
monitor_speed = ${extra.uart_speed}
